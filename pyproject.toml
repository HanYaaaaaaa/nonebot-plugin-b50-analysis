[tool.poetry]
name = "nonebot-plugin-b50-analysis"
version = "0.1.2"
description = "舞萌DX B50数据分析 NoneBot2 插件，支持锐评文本和分析图生成"
authors = ["HanYaaaaaaa"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/HanYaaaaaaa/nonebot-plugin-b50-analysis"
repository = "https://github.com/HanYaaaaaaa/nonebot-plugin-b50-analysis"
keywords = ["nonebot2", "maimai", "maimaidx", "b50", "diving-fish"]

# NoneBot2 插件商店必需字段
[tool.poetry.plugins."nonebot.plugin"]
"nonebot_plugin_b50_analysis" = "nonebot_plugin_b50_analysis"

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = ">=2.3.0"
nonebot-adapter-onebot = ">=2.4.0"
openai = ">=1.0.0"
httpx = ">=0.27.0"
Pillow = ">=10.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
